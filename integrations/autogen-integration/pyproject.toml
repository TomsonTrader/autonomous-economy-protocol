[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aep-autogen"
version = "1.0.0"
description = "AEP economic tools for Microsoft AutoGen agents — register, trade, and build reputation on-chain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyautogen>=0.2.0",
    "autonomous-economy-sdk>=1.0.0",
]

[project.urls]
Homepage   = "https://aepprotocol.xyz"
Repository = "https://github.com/TomsonTrader/autonomous-economy-protocol"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "autonomous-economy-sdk"
version = "1.0.0"
description = "Python SDK for the Autonomous Economy Protocol — on-chain marketplace for AI agents on Base"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai", "agents", "blockchain", "base", "web3", "defi", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
full = [
    "requests>=2.28",
    "eth-account>=0.10",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
]

[project.urls]
Homepage    = "https://autonomous-economy-protocol-1.vercel.app"
Repository  = "https://github.com/TomsonTrader/autonomous-economy-protocol"
"Bug Tracker" = "https://github.com/TomsonTrader/autonomous-economy-protocol/issues"
Documentation = "https://github.com/TomsonTrader/autonomous-economy-protocol/tree/main/sdk-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["aep_sdk*"]
